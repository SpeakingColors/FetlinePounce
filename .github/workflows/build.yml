name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fetlinepounce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core DSP tests (no JUCE, with sanitizers)
        run: sh tests/run.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Download pluginval
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -o pluginval.zip
          chmod +x pluginval
      - name: pluginval (strictness 10)
        run: xvfb-run -a ./pluginval --strictness-level 10 --skip-gui-tests build/FetlinePounce_artefacts/Release/VST3/FetlinePounce.vst3
      - uses: actions/upload-artifact@v4
        with:
          name: FetlinePounce-linux-vst3
          path: build/FetlinePounce_artefacts/Release/VST3/FetlinePounce.vst3

  editor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libgl1-mesa-dev xvfb
      - name: Build the snapshot tool
        run: |
          cmake -S . -B build-snap -DCMAKE_BUILD_TYPE=Release -DFP_BUILD_SNAPSHOT=ON
          cmake --build build-snap --target FetlineSnapshot -j4
      - name: Self tests (parameter mapping, state round trip, latency, editor create and resize)
        run: xvfb-run -a build-snap/FetlineSnapshot_artefacts/Release/FetlineSnapshot --selftest tests/fixtures/state-v1.xml
      - name: Render the real window
        run: |
          set +e
          mkdir -p shots
          S=build-snap/FetlineSnapshot_artefacts/Release/FetlineSnapshot
          r() { out=$1; shift; xvfb-run -a $S "shots/$out" "$@" > "render-$out.log" 2>&1; rc=$?; echo "$out exit $rc" ; if [ $rc -ne 0 ] || [ ! -s "shots/$out" ]; then tail -n 4 "render-$out.log" | while IFS= read -r l; do echo "::warning::$out: ${l:0:250}"; done; fi; }
          r look-C.png 1.0 C none 366
          r look-A.png 1.0 A none 366
          r look-B.png 1.0 B none 366
          r small.png 0.5 C none 60
          for d in settings guide about presets save export import; do r dialog-$d.png 1.0 C $d 30; done
          ls -l shots
          test -s shots/look-C.png || { echo "::error::look-C.png was not rendered"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: FetlinePounce-editor-snapshots
          path: shots
      - name: Publish the screenshots to the snapshots branch (the sandbox cannot download artifacts)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name SpeakingColors
          git config user.email SpeakingColors@users.noreply.github.com
          cp -r shots "$RUNNER_TEMP/shots"
          git checkout --orphan snapshots
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/shots/"*.png .
          git add -- *.png
          git commit -m "Editor snapshots from the real compiled window (${GITHUB_SHA::7})"
          git push --force origin snapshots

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: FetlinePounce-windows-vst3
          path: build/FetlinePounce_artefacts/Release/VST3/FetlinePounce.vst3

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j4
      - uses: actions/upload-artifact@v4
        with:
          name: FetlinePounce-macos-vst3
          path: build/FetlinePounce_artefacts/Release/VST3/FetlinePounce.vst3
